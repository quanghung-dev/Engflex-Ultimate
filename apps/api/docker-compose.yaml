services:
  postgres:
    container_name: engflex_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - engflex_postgres_data:/var/lib/postgresql

  redis:
    container_name: engflex_redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - engflex_redis_data:/data

volumes:
  engflex_postgres_data:
  engflex_redis_data:
