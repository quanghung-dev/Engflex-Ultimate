[project]
name = "engflex-voice"
version = "0.1.0"
description = "EngFlex Pipecat voice engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pipecat-ai[deepgram,fish,runner,sentry,silero,webrtc]>=1.8.0",
  # piper-tts is NOT used by the engine: the live e2e fixture
  # (scripts/make_fake_mic_audio.py) synthesizes its fake-mic WAV offline
  # with it, which must stay network-free and key-free.
  "piper-tts>=1.8.0",
  "pydantic-settings>=2.4",
  "loguru>=0.7.2",
  "aiohttp>=3.10",
  # Imported at module level by src/analysis.py; transitive-only today via
  # pipecat-ai, so pin it directly instead of relying on the resolver.
  "openai>=3.19.2",
  # Imported at module level by src/transcript/prerecorded.py; transitive-only
  # today via the pipecat-ai deepgram extra, so pinned directly the same way.
  "deepgram-sdk>=7.10.0",
  "torch>=2.14.0",
  "openpronounce>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Transient upstream defect (2026-09): google-crc32c 1.9.0 ships macOS-only
# wheels (no sdist, no manylinux). Pulled in via aiortc (pipecat webrtc
# extra). Constrain below 1.9 until upstream publishes Linux wheels again.
[tool.uv]
constraint-dependencies = ["google-crc32c<1.9"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

# pytest runs from apps/voice; src/ holds the package so top-level imports
# (config, prompts, …) resolve from tests/ without __init__.py tricks.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
